version: 2
updates:
  # Keep the pinned GitHub Actions (checkout, setup-python, lychee, typos) up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  # Keep the image checker's Python dependencies (urllib3, pytest) up to date.
  - package-ecosystem: pip
    directory: /.github/scripts
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: ci
