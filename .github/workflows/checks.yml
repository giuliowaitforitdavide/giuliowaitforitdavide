name: README checks

on:
  push:
    branches: [main]
    paths: ["**.md", "lychee.toml", ".github/**"]
  pull_request:
    paths: ["**.md", "lychee.toml", ".github/**"]
  schedule:
    # Every Monday at 07:00 UTC: external links and cards can break without any change here.
    # NOTE: GitHub disables scheduled workflows after 60 days without repository activity.
    # If you get the "workflow disabled" email, re-enable it from Actions > README checks.
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per branch: a new push cancels the outdated run (never cancel runs on main).
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  links:
    name: Links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check links in Markdown files
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config lychee.toml --no-progress './**/*.md'

  images:
    name: Images render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .github/scripts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test the image checker
        run: python -m pytest -q

      # Stats cards and badges answer 200 even when they draw an error: look inside each image.
      - name: Check that images render without errors
        working-directory: .
        run: python .github/scripts/check_images.py

  spelling:
    name: Spelling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check spelling
        uses: crate-ci/typos@276087d9a4f06398b3e04825487805e2d7375888 # v1.52.2
